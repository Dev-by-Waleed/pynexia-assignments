<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List App</title>
  <meta name="description" content="A simple task manager: add, edit, complete and delete tasks. Saved to localStorage.">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="app">
    <header class="app__header">
      <h1 class="app__title">To-Do List</h1>
      <p class="app__subtitle">Add, edit, complete and delete tasks — everything is saved in your browser.</p>
    </header>

    <form class="task-form" id="task-form" autocomplete="off">
      <label class="sr-only" for="task-input">New task</label>
      <input
        class="task-form__input"
        id="task-input"
        name="task"
        type="text"
        placeholder="What needs to be done?"
        maxlength="200"
      >
      <button class="task-form__button" type="submit">Add task</button>
    </form>

    <ul class="task-list" id="task-list"></ul>

    <p class="empty-state" id="empty-state" hidden>
      🗂️ Nothing here yet — add your first task above.
    </p>

    <footer class="app__footer" id="app-footer" hidden>
      <span class="task-count" id="task-count">0 tasks</span>
      <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
    </footer>
  </main>

  <template id="task-template">
    <li class="task-item">
      <div class="task-item__main">
        <input class="task-item__checkbox" type="checkbox" aria-label="Mark task as complete">
        <span class="task-item__text"></span>
        <input class="task-item__edit-input" type="text" maxlength="200" aria-label="Edit task" placeholder="Press Enter to save, Esc to cancel">
      </div>

      <div class="task-item__actions">
        <button class="icon-button icon-button--edit" type="button" aria-label="Edit task" title="Edit">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
          </svg>
        </button>

        <button class="icon-button icon-button--delete" type="button" aria-label="Delete task" title="Delete">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M3 6h18"></path>
            <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"></path>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
            <path d="M10 11v6"></path>
            <path d="M14 11v6"></path>
          </svg>
        </button>
      </div>
    </li>
  </template>

</body>
</html>
